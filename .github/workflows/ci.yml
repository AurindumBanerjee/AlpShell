name: ci

on:
  push:
  pull_request:

jobs:
  make:
    name: make build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make libreadline-dev
      - name: Build
        run: make -C shell -j2

  cmake:
    name: cmake build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ cmake libreadline-dev
      - name: Configure and build
        run: |
          cmake -S shell -B shell/build-cmake
          cmake --build shell/build-cmake -j2

  asan:
    name: asan and ubsan build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make libreadline-dev
      - name: Build with AddressSanitizer and UBSan
        run: make -C shell asan -j2
