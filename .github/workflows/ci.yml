name: ci

on:
  push:
  pull_request:

jobs:
  make:
    name: make build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make libreadline-dev python3 procps
      - name: Build
        run: make -C shell -j2
      - name: Test (unit, script vs bash, pty, fork failure)
        run: make -C shell test

  cmake:
    name: cmake build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ cmake libreadline-dev python3 procps
      - name: Configure and build
        run: |
          cmake -S shell -B shell/build-cmake
          cmake --build shell/build-cmake -j2
      - name: Test
        run: ctest --test-dir shell/build-cmake --output-on-failure

  asan:
    name: asan and ubsan tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make libreadline-dev python3 procps
      - name: Build and test with AddressSanitizer and UBSan
        run: make -C shell test-asan
